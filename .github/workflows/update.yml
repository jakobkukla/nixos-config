name: "Update machines"

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '30 04 * * WED' # runs weekly on Wednesday at 04:30 UTC

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake.lock
        run: nix flake update

      - name: Upload flake.lock artifact
        uses: actions/upload-artifact@v7
        with:
          name: flake_lock
          path: flake.lock

  build:
    needs: update
    strategy:
      matrix:
        machine: [ aztec, cache, inferno, mirage, triton, vertigo ]
    uses: ./.github/workflows/reusable-base.yml
    with:
      machine: ${{ matrix.machine }}
      update: true
    secrets: inherit

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download flake.lock artifact
        uses: actions/download-artifact@v8
        with:
          name: flake_lock

      - name: Commit flake.lock
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'build(deps): update packages'
          file_pattern: 'flake.lock'

      - name: Promote to stable
        uses: ./.github/actions/promote-stable

